name: Build unsigned IPA

# 在 GitHub 网页上点 Actions → Build unsigned IPA → Run workflow
# 跑完在 Artifacts 里下载 LumiGen-unsigned.ipa，用 Windows 上的 Sideloadly 签名安装。

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 有 Xcode 26 就用它（真·液态玻璃），没有就用默认版本（自动退回近似玻璃）
      - name: Pick newest Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          for v in 26.2 26.1 26.0 26; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              echo "using Xcode_${v}"
              sudo xcode-select -s "/Applications/Xcode_${v}.app"
              break
            fi
          done
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Build (no codesign)
        run: |
          set -o pipefail
          xcodebuild \
            -project LumiGen.xcodeproj \
            -scheme LumiGen \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LumiGen.app Payload/
          zip -qry LumiGen-unsigned.ipa Payload
          ls -lh LumiGen-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LumiGen-unsigned-ipa
          path: LumiGen-unsigned.ipa
          if-no-files-found: error
